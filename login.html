<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SUD Brazilian Jiu-Jitsu</title>
    <!-- ✅ ÍCONE NA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href="imagens/logosud.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ✅ PWA — Instalar como Aplicativo -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D10000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SUD Jiu-Jitsu">
    <link rel="apple-touch-icon" href="imagens/logosud.png">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        :root {
            --vermelho-principal: #D10000;
            --vermelho-claro: #FF3B3B;
            --fundo-escuro: #121214;
            --fundo-card: #1A1A1F;
            --texto-branco: #FFFFFF;
            --texto-cinza: #B0B0B8;
            --borda: #29292E;
            --sucesso: #00C853;
            --erro: #FF4D4D;
            --info: #FFC107;
        }
        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('imagens/capa-sud.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .caixa-login {
            background-color: var(--fundo-card);
            padding: 35px 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--vermelho-principal);
            box-shadow: 0 0 25px rgba(209, 0, 0, 0.25);
        }
        .logo { 
            text-align: center; 
            margin-bottom: 25px; 
        }
        .logo img { 
            height: 85px; 
        }
        h2 {
            text-align: center;
            color: var(--texto-branco);
            margin-bottom: 30px;
            font-size: 1.6rem;
            font-weight: 700;
        }
        .campo { 
            margin-bottom: 22px; 
        }
        label {
            display: block;
            color: var(--texto-cinza);
            margin-bottom: 8px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 13px;
            background-color: var(--fundo-escuro);
            border: 1px solid var(--borda);
            color: var(--texto-branco);
            border-radius: 6px;
            font-size: 1rem;
            transition: border 0.2s;
        }
        input:focus { 
            outline: none; 
            border-color: var(--vermelho-principal);
            box-shadow: 0 0 0 2px rgba(209, 0, 0, 0.15);
        }
        .btn-entrar {
            width: 100%;
            padding: 14px;
            background-color: var(--vermelho-principal);
            color: var(--texto-branco);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }
        .btn-entrar:hover { 
            background-color: var(--vermelho-claro); 
        }
        .btn-voltar {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--texto-cinza);
            border: 1px solid var(--borda);
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-voltar:hover {
            color: var(--vermelho-principal);
            border-color: var(--vermelho-principal);
            background-color: rgba(209, 0, 0, 0.08);
        }
        .btn-instalar {
            width: 100%;
            padding: 12px;
            background-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn-instalar:hover {
            background-color: rgba(37, 99, 235, 0.25);
            color: #93c5fd;
        }
        #mensagem {
            margin-top: 18px;
            padding: 13px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            display: none;
            font-size: 0.95rem;
        }
        .sucesso { background-color: rgba(0, 200, 83, 0.15); color: var(--sucesso); border: 1px solid rgba(0, 200, 83, 0.3); }
        .erro { background-color: rgba(255, 77, 77, 0.15); color: var(--erro); border: 1px solid rgba(255, 77, 77, 0.3); }
        .info { background-color: rgba(255, 193, 7, 0.15); color: var(--info); border: 1px solid rgba(255, 193, 7, 0.3); }
        @media (max-width: 400px) {
            .caixa-login {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="caixa-login">
        <div class="logo">
            <img src="imagens/logosud.png" alt="Logo SUD Brazilian Jiu-Jitsu">
        </div>
        <h2>Acesse sua conta</h2>
        <div id="mensagem"></div>
        <button id="btnInstalarApp" class="btn-instalar" style="display:none;" onclick="instalarApp()">
            <i class="fas fa-download"></i> Instalar Aplicativo
        </button>
        <form id="formLogin">
            <div class="campo">
                <label>E-mail ou Telefone</label>
                <input type="text" id="login" placeholder="seu@email.com ou (91) 99999-9999" required>
            </div>
            <div class="campo">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
        </form>
        <a href="index.html" class="btn-voltar">
            <i class="fas fa-arrow-left"></i> Voltar para o Início
        </a>
    </div>

    <!-- ✅ Firebase Modular — Versão que funciona no GitHub Pages -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-auth.js";
        import { getFirestore, collection, query, where, limit, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore.js";

        // ✅ FIREBASE DA SUD BRAZILIAN JIU-JITSU
        const firebaseConfig = {
            apiKey: "AIzaSyDKWso0gw6T2thoS12c1erzTzVhrnagS1s",
            authDomain: "sud-brazilian-jiu-jitsu.firebaseapp.com",
            projectId: "sud-brazilian-jiu-jitsu",
            storageBucket: "sud-brazilian-jiu-jitsu.firebasestorage.app",
            messagingSenderId: "1053972036308",
            appId: "1:1053972036308:web:215a41d7bc91502eee1941"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ✅ PWA — Instalar App
        let promptInstalacao;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            promptInstalacao = e;
            document.getElementById('btnInstalarApp').style.display = 'flex';
        });

        async function instalarApp() {
            if (!promptInstalacao) {
                alert('Use o menu do navegador → "Instalar aplicativo"');
                return;
            }
            promptInstalacao.prompt();
            promptInstalacao = null;
            document.getElementById('btnInstalarApp').style.display = 'none';
        }

        window.addEventListener('appinstalled', () => {
            alert('✅ SUD BRAZILIAN JIU-JITSU instalado com sucesso!');
            document.getElementById('btnInstalarApp').style.display = 'none';
        });

        // ✅ Exibir mensagens
        function mostrarMensagem(texto, tipo) {
            const el = document.getElementById('mensagem');
            el.textContent = texto;
            el.className = tipo;
            el.style.display = 'block';
        }

        // ✅ Verificar se é telefone
        function ehTelefone(valor) {
            const apenasNumeros = valor.replace(/\D/g, '');
            return apenasNumeros.length >= 10 && apenasNumeros.length <= 11;
        }

        // ✅ Buscar e-mail pelo telefone
        async function buscarEmailPorTelefone(telefone) {
            const telSemFormatacao = telefone.replace(/\D/g, '');
            const q = query(
                collection(db, 'usuarios'),
                where('telefone', '==', telSemFormatacao),
                limit(1)
            );
            const snapshot = await getDocs(q);
            if (!snapshot.empty) {
                return snapshot.docs[0].data().email;
            }
            return null;
        }

        // ✅ Login
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const entrada = document.getElementById('login').value.trim();
            const senha = document.getElementById('senha').value.trim();
            let emailFinal = entrada;

            mostrarMensagem("🔄 Verificando dados...", "info");

            try {
                if (ehTelefone(entrada)) {
                    const emailEncontrado = await buscarEmailPorTelefone(entrada);
                    if (!emailEncontrado) {
                        throw new Error("Telefone não cadastrado no sistema!");
                    }
                    emailFinal = emailEncontrado;
                }

                const resultado = await signInWithEmailAndPassword(auth, emailFinal, senha);
                const usuario = resultado.user;

                // Buscar dados do usuário
                const docRef = await getDoc(collection(db, 'usuarios').doc(usuario.uid));
                if (!docRef.exists()) {
                    throw new Error("Conta existe, mas sem cadastro no sistema!");
                }

                const dados = docRef.data();
                if (dados.tipo === "admin") {
                    mostrarMensagem("✅ Acesso de Administrador! Entrando...", "sucesso");
                    setTimeout(() => window.location.href = "dashboard.html", 1200);
                } else if (dados.tipo === "aluno") {
                    mostrarMensagem("✅ Acesso de Aluno! Entrando...", "sucesso");
                    setTimeout(() => window.location.href = "aluno.html", 1200);
                } else {
                    throw new Error("Tipo de usuário não definido: " + dados.tipo);
                }
            } catch (erro) {
                let msg;
                switch(erro.code) {
                    case "auth/user-not-found":
                        msg = "❌ E-mail ou telefone não cadastrado";
                        break;
                    case "auth/wrong-password":
                        msg = "❌ Senha incorreta";
                        break;
                    case "auth/invalid-email":
                        msg = "❌ Formato inválido. Use e-mail ou telefone correto";
                        break;
                    case "auth/network-request-failed":
                        msg = "❌ Sem conexão com o Firebase";
                        break;
                    default:
                        msg = "❌ " + erro.message;
                }
                mostrarMensagem(msg, "erro");
            }
        });
    </script>
</body>
</html>
