<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SUD Brazilian Jiu-Jitsu</title>
    <link rel="icon" href="imagens/logosud.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        :root {
            --vermelho: #D10000;
            --vermelho-claro: #FF3B3B;
            --escuro: #050505;
            --meio-escuro: #121212;
            --texto: #FFFFFF;
            --cinza: #888;
            --erro: #ff4444;
            --sucesso: #00C851;
        }
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .caixa-login {
            background: var(--meio-escuro);
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(209, 0, 0, 0.15);
            border: 1px solid #222;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            height: 80px;
            margin-bottom: 10px;
        }
        .logo h1 {
            font-size: 1.3rem;
            color: var(--texto);
        }
        .logo p {
            font-size: 0.85rem;
            color: var(--cinza);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ddd;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: var(--vermelho);
        }
        .btn-entrar {
            width: 100%;
            padding: 14px;
            background: var(--vermelho);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-entrar:hover {
            background: var(--vermelho-claro);
        }
        .btn-entrar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .mensagem {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .erro {
            background: rgba(255, 68, 68, 0.1);
            color: #ff6666;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
        .sucesso {
            background: rgba(0, 200, 81, 0.1);
            color: #00e660;
            border: 1px solid rgba(0, 200, 81, 0.3);
        }
        .voltar {
            text-align: center;
            margin-top: 25px;
        }
        .voltar a {
            color: var(--cinza);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .voltar a:hover {
            color: white;
        }
    </style>
</head>
<body>
<div class="caixa-login">
    <div class="logo">
        <img src="imagens/logosud.png" alt="SUD Brazilian Jiu-Jitsu">
        <h1>Área Administrativa</h1>
        <p>Acesso restrito ao responsável</p>
    </div>
    <form id="formLogin">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required placeholder="Sua senha">
        </div>
        <button type="submit" class="btn-entrar" id="btnEntrar">
            <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
    </form>
    <div class="mensagem" id="caixaMensagem"></div>
    <div class="voltar">
        <a href="index.html">← Voltar para a página inicial</a>
    </div>
</div>

<!-- ✅ EXATAMENTE a versão que funcionou -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-auth.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDKWso0gw6T2thoS12c1erzTzVhrnagS1s",
        authDomain: "sud-brazilian-jiu-jitsu.firebaseapp.com",
        projectId: "sud-brazilian-jiu-jitsu",
        storageBucket: "sud-brazilian-jiu-jitsu.firebasestorage.app",
        messagingSenderId: "1053972036308",
        appId: "1:1053972036308:web:215a41d7bc91502eee1941"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    const formLogin = document.getElementById('formLogin');
    const btnEntrar = document.getElementById('btnEntrar');
    const caixaMensagem = document.getElementById('caixaMensagem');
    
    function mostrarMensagem(texto, tipo) {
        caixaMensagem.style.display = 'block';
        caixaMensagem.className = 'mensagem ' + tipo;
        caixaMensagem.textContent = texto;
    }
    
    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        
        btnEntrar.disabled = true;
        btnEntrar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
        caixaMensagem.style.display = 'none';
        
        try {
            await signInWithEmailAndPassword(auth, email, senha);
            mostrarMensagem('✅ Entrando...', 'sucesso');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        } catch (erro) {
            btnEntrar.disabled = false;
            btnEntrar.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar';
            
            let mensagemErro = 'Erro ao entrar. Tente novamente.';
            if (erro.code === 'auth/user-not-found') {
                mensagemErro = 'Usuário não encontrado.';
            } else if (erro.code === 'auth/wrong-password') {
                mensagemErro = 'Senha incorreta.';
            } else if (erro.code === 'auth/invalid-email') {
                mensagemErro = 'E-mail inválido.';
            } else if (erro.code === 'auth/too-many-requests') {
                mensagemErro = 'Muitas tentativas. Tente mais tarde.';
            }
            
            mostrarMensagem('❌ ' + mensagemErro, 'erro');
        }
    });
</script>
</body>
</html>
