<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SUD Brazilian Jiu-Jitsu</title>
    <link rel="icon" href="imagens/logosud.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        :root {
            --vermelho: #D10000;
            --vermelho-claro: #FF3B3B;
            --escuro: #050505;
            --meio-escuro: #121212;
            --texto: #FFFFFF;
            --cinza: #888;
            --erro: #ff4444;
            --sucesso: #00C851;
        }
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .caixa-cadastro {
            background: var(--meio-escuro);
            padding: 35px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 30px rgba(209, 0, 0, 0.15);
            border: 1px solid #222;
        }
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo img {
            height: 70px;
            margin-bottom: 10px;
        }
        .logo h1 {
            font-size: 1.2rem;
            color: var(--texto);
        }
        .logo p {
            font-size: 0.85rem;
            color: var(--cinza);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #ddd;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: var(--vermelho);
        }
        .btn-cadastrar {
            width: 100%;
            padding: 13px;
            background: var(--vermelho);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 8px;
        }
        .btn-cadastrar:hover {
            background: var(--vermelho-claro);
        }
        .btn-cadastrar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .mensagem {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .erro {
            background: rgba(255, 68, 68, 0.1);
            color: #ff6666;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
        .sucesso {
            background: rgba(0, 200, 81, 0.1);
            color: #00e660;
            border: 1px solid rgba(0, 200, 81, 0.3);
        }
        .links {
            margin-top: 20px;
            text-align: center;
        }
        .links a {
            color: var(--cinza);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .links a:hover {
            color: var(--vermelho-claro);
        }
    </style>
</head>
<body>

<div class="caixa-cadastro">
    <div class="logo">
        <img src="imagens/logosud.png" alt="SUD Brazilian Jiu-Jitsu">
        <h1>Criar Conta</h1>
        <p>Faça parte da família SUD</p>
    </div>

    <form id="formCadastro">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required placeholder="Seu nome completo">
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label for="senha">Senha (mínimo 6 caracteres)</label>
            <input type="password" id="senha" required placeholder="Crie uma senha">
        </div>
        <div class="form-group">
            <label for="confirmarSenha">Confirmar Senha</label>
            <input type="password" id="confirmarSenha" required placeholder="Digite novamente">
        </div>
        <button type="submit" class="btn-cadastrar" id="btnCadastrar">
            <i class="fa-solid fa-user-plus"></i> Criar Conta
        </button>
    </form>

    <div class="mensagem" id="caixaMensagem"></div>

    <div class="links">
        <a href="login.html">Já tem conta? Fazer login →</a>
        <a href="index.html" style="display:block; margin-top:10px;">← Voltar para a página inicial</a>
    </div>
</div>

<!-- ✅ Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDKWso0gw6T2thoS12c1erzTzVhrnagS1s",
        authDomain: "sud-brazilian-jiu-jitsu.firebaseapp.com",
        projectId: "sud-brazilian-jiu-jitsu",
        storageBucket: "sud-brazilian-jiu-jitsu.firebasestorage.app",
        messagingSenderId: "1053972036308",
        appId: "1:1053972036308:web:215a41d7bc91502eee1941"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const formCadastro = document.getElementById('formCadastro');
    const btnCadastrar = document.getElementById('btnCadastrar');
    const caixaMensagem = document.getElementById('caixaMensagem');

    function mostrarMensagem(texto, tipo) {
        caixaMensagem.style.display = 'block';
        caixaMensagem.className = 'mensagem ' + tipo;
        caixaMensagem.textContent = texto;
    }

    formCadastro.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const confirmarSenha = document.getElementById('confirmarSenha').value;

        if (senha !== confirmarSenha) {
            mostrarMensagem('❌ As senhas não coincidem.', 'erro');
            return;
        }

        if (senha.length < 6) {
            mostrarMensagem('❌ A senha deve ter pelo menos 6 caracteres.', 'erro');
            return;
        }

        btnCadastrar.disabled = true;
        btnCadastrar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando...';
        caixaMensagem.style.display = 'none';

        try {
            await createUserWithEmailAndPassword(auth, email, senha);
            mostrarMensagem('✅ Conta criada! Redirecionando...', 'sucesso');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        } catch (erro) {
            btnCadastrar.disabled = false;
            btnCadastrar.innerHTML = '<i class="fa-solid fa-user-plus"></i> Criar Conta';
            
            let mensagemErro = 'Erro ao criar conta. Tente novamente.';
            if (erro.code === 'auth/email-already-in-use') {
                mensagemErro = 'Este e-mail já está cadastrado.';
            } else if (erro.code === 'auth/invalid-email') {
                mensagemErro = 'E-mail inválido.';
            } else if (erro.code === 'auth/operation-not-allowed') {
                mensagemErro = 'Cadastro não ativado. Ative no Firebase → Autenticação.';
            } else if (erro.code === 'auth/weak-password') {
                mensagemErro = 'Senha muito fraca. Use pelo menos 6 caracteres.';
            }
            
            mostrarMensagem('❌ ' + mensagemErro, 'erro');
        }
    });
</script>

</body>
</html>
